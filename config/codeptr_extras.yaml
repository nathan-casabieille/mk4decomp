# Extra VA -> native-function entries for the MK4_ResolveCode trampoline.
#
# gen_codeptr_table.py builds its table from symbols.yaml, so a callback
# target that has no symbol - typically a small handler packed inside a
# larger blob entry - cannot be registered there. Listing it here adds it to
# the trampoline without touching symbols.yaml, and so without any risk to
# the matching build. The named function must be defined in a TU listed in
# native_full_srcs.txt.
