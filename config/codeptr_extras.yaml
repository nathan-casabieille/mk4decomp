  # Phase4 bone-init band, dispatch protocol measured against the binary:
  # 0x412ff0/0x4131f0/0x413310 are record +0x10 ticks (record staged in
  # 0x542048; dispatched by RenderSceneNode's emit path), 0x407560 is the
  # motion integrator, 0x412cd0/0x412d80/0x412ec0 are controller FSMs
  # (g_baseSel = the controller node, captured group at +0x2c), and
  # 0x413230 is the AllocNode callback carried by skeleton template
  # 0x4d6948.
  #
  # The FSMs and the launch tick were parked for a while behind what
  # looked like a pool-sequencing defect; it was really a placeholder
  # name shadowing ChainWalkPushPop in the destroy path (commit
  # 20ae3c44b). With the owner resolver restored they are registered.
  #
  # NEVER register 0x4130c0 (the head block) or its two entry thunks
  # 0x413040/0x413070: the head block POPS the group its thunks PUSH, so
  # a table dispatch of it corrupts the mstack (measured, exit=139).
  # the character-select controller RoundSetupSpawn allocates
  0x455f00: CharSelectController_00455f00
  0x412cd0: Phase4IdleFsm_00412cd0
  0x412d80: Phase4StageFsm_00412d80
  0x412ec0: Phase4ArmFsm_00412ec0
