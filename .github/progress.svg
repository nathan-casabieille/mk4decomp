<svg xmlns="http://www.w3.org/2000/svg" width="720" height="218" viewBox="0 0 720 218" role="img" aria-label="MK4 decomp progress 87.5%">
  <title>MK4 decomp progress: 87.5% functional understanding (composite)</title>
  <defs>
    <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffd24a"/>
      <stop offset="45%"  stop-color="#f59e0b"/>
      <stop offset="80%"  stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="rowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffd24a"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <!-- Outer card -->
  <rect x="1" y="1" width="718" height="216" rx="8" ry="8"
        fill="#0a0a0a" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Composite track -->
  <rect x="12" y="14" width="696" height="36" rx="6" ry="6"
        fill="#1a1a1a" stroke="#3a2a14" stroke-width="1"/>

  <!-- Composite filled portion -->
  <rect x="12" y="14" width="609.06" height="36" rx="6" ry="6"
        fill="url(#fillGrad)"/>

  <!-- Top highlight on composite -->
  <rect x="12" y="14" width="609.06" height="8" rx="6" ry="6"
        fill="#ffffff" opacity="0.18"/>

  <!-- Composite label + percent (single line) -->
  <text x="360.0" y="38.0"
        font-family="Impact, 'Arial Black', sans-serif" font-size="18" font-weight="900"
        text-anchor="middle" fill="#fff8e1"
        stroke="#1a0a0a" stroke-width="1.2" paint-order="stroke fill"
        letter-spacing="1.5">FUNCTIONAL UNDERSTANDING - 87.5%</text>

  <text x="14" y="80" font-family="'DejaVu Sans', Verdana, sans-serif"
        font-size="13" fill="#fde68a">Byte-perfect rebuild</text>
  <rect x="200" y="69" width="500" height="16" rx="3" ry="3"
        fill="#1a1a1a" stroke="#3a2a14" stroke-width="1"/>
  <rect x="200" y="69" width="500.00" height="16" rx="3" ry="3"
        fill="url(#rowGrad)"/>
  <text x="694" y="81" font-family="'DejaVu Sans Mono', monospace"
        font-size="12" fill="#fff8e1" text-anchor="end" font-weight="bold">100.0%</text>
  <text x="14" y="108" font-family="'DejaVu Sans', Verdana, sans-serif"
        font-size="13" fill="#fde68a">Pure C (portability)</text>
  <rect x="200" y="97" width="500" height="16" rx="3" ry="3"
        fill="#1a1a1a" stroke="#3a2a14" stroke-width="1"/>
  <rect x="200" y="97" width="244.17" height="16" rx="3" ry="3"
        fill="url(#rowGrad)"/>
  <text x="694" y="109" font-family="'DejaVu Sans Mono', monospace"
        font-size="12" fill="#fff8e1" text-anchor="end" font-weight="bold">48.8% (ceiling ~49%)</text>
  <text x="14" y="136" font-family="'DejaVu Sans', Verdana, sans-serif"
        font-size="13" fill="#fde68a">Function naming</text>
  <rect x="200" y="125" width="500" height="16" rx="3" ry="3"
        fill="#1a1a1a" stroke="#3a2a14" stroke-width="1"/>
  <rect x="200" y="125" width="431.37" height="16" rx="3" ry="3"
        fill="url(#rowGrad)"/>
  <text x="694" y="137" font-family="'DejaVu Sans Mono', monospace"
        font-size="12" fill="#fff8e1" text-anchor="end" font-weight="bold">86.3%</text>
  <text x="14" y="164" font-family="'DejaVu Sans', Verdana, sans-serif"
        font-size="13" fill="#fde68a">Global naming</text>
  <rect x="200" y="153" width="500" height="16" rx="3" ry="3"
        fill="#1a1a1a" stroke="#3a2a14" stroke-width="1"/>
  <rect x="200" y="153" width="428.69" height="16" rx="3" ry="3"
        fill="url(#rowGrad)"/>
  <text x="694" y="165" font-family="'DejaVu Sans Mono', monospace"
        font-size="12" fill="#fff8e1" text-anchor="end" font-weight="bold">85.7%</text>
  <text x="14" y="192" font-family="'DejaVu Sans', Verdana, sans-serif"
        font-size="13" fill="#fde68a">Struct field coverage</text>
  <rect x="200" y="181" width="500" height="16" rx="3" ry="3"
        fill="#1a1a1a" stroke="#3a2a14" stroke-width="1"/>
  <rect x="200" y="181" width="452.59" height="16" rx="3" ry="3"
        fill="url(#rowGrad)"/>
  <text x="694" y="193" font-family="'DejaVu Sans Mono', monospace"
        font-size="12" fill="#fff8e1" text-anchor="end" font-weight="bold">90.5%</text>
</svg>
